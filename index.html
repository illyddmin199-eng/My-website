<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій сайт про книги</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.5;
      background: #f5f7fa;
      color: #1f2937;
    }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Бібліотека рекомендацій</h1>
    <p>Навчальний проєкт, розміщений на GitHub Pages.</p>
  </div>

  <div class="card">
    <h2>Популярні книги</h2>
    <ul>
      <li><strong>Тіні забутих предків</strong> — Михайло Коцюбинський</li>
      <li><strong>Кайдашева сім'я</strong> — Іван Нечуй-Левицький</li>
      <li><strong>Тигролови</strong> — Іван Багряний</li>
    </ul>
  </div>
</body>
</html>
